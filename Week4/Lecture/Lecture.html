Why flexbox?

<body>
    <nav>
        <!-- Flex containers vs Flex items
         Normally HTML elements stack vertically,
         flexbox gives us an easier way to control how elements arrange-->
         <a href ="#">Home</a>
         <a href ="#">About</a>
         <a href ="#">Contact</a>
    </nav>

    <section class="cards">
        <div>Game 1</div>
        <div>Game 2</div>
        <div>Game 3</div>        
    </section>

    <!-- Flex container is the sections
    Divs are the items -->

</body>
