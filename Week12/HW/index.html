<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Pizza Parlor</h1>
    <p>Build your own pizza order!</p>

    <form id="pizza_form">
         <!-- Customer Name -->
    <label for="customer_name">Customer Name:</label>
    <input type="text" id="customer_name" placeholder="Enter your name" required>

    <br><br>

    <!-- Pizza Size -->
    <p>Choose Your Pizza Size:</p>

    <label>
        <input type="radio" name="size" value="Small" required>
        Small
    </label>

    <label>
        <input type="radio" name="size" value="Medium">
        Medium
    </label>

    <label>
        <input type="radio" name="size" value="Large">
        Large
    </label>

    <br><br>
     <!-- Pizza Type -->
    <label for="pizza_type">Choose Your Pizza:</label>

    <select id="pizza_type" required>
        <option value="">Select a pizza</option>
        <option value="Pepperoni">Pepperoni</option>
        <option value="Cheese">Cheese</option>
        <option value="Supreme">Supreme</option>
        <option value="Hawaiian">Hawaiian</option>
    </select>

    <br><br>

    <!-- Quantity -->
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" min="1" max="20" value="1" required>

    <br><br>
    <!-- Extra Toppings -->
    <p>Choose Extra Toppings:</p>

    <label>
        <input type="checkbox" name="toppings" value="Mushrooms">
        Mushrooms
    </label>

    <label>
        <input type="checkbox" name="toppings" value="Olives">
        Olives
    </label>

    <label>
        <input type="checkbox" name="toppings" value="Bacon">
        Bacon
    </label>

    <label>
        <input type="checkbox" name="toppings" value="Extra Cheese">
        Extra Cheese
    </label>

    <br><br>

    <button type="submit">Place Order</button>
    </form>

    <section id="results">

    </section>

    <script src="script.js"></script>
</body>
</html>
