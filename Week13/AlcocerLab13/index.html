<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 13- Form Validation</title>
    <style>
    .error {
        color: red;
    }

    .success {
        color: green;
    }

    form {
        display: grid;
        gap: 10px;
        max-width: 400px;
    }

    label {
        font-weight: bold;
    }
</style>
</head>
<body>

    <!-- This is all of the labels for the form itself so they appear -->
    <h1>Contact Form</h1>
    <form id="contactForm" novalidate>

    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name" required>
    <p id="nameError" class="error"></p>

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter your email" required>
    <p id="emailError" class="error"></p>

    <label for="age">Age:</label>
    <input type="number" id="age" placeholder="Enter your age" min="1" required>
    <p id="ageError" class="error"></p>

    <button type="submit">Submit</button>

</form>

<!-- This will show the success after submitting -->
<p id="successMessage" class="success"></p>

<script src="script.js"></script>
</body>
</html>
